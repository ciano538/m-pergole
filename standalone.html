<style>
/* Layout: one narrow column read at the table. A voice prompt on top, then the order slip (primo, secondo, vino) it produces. */
:root {
  --bg: #16111a;
  --surface: #1f1824;
  --surface-2: #2a2130;
  --fg: #f3ece6;
  --muted: #a99cae;
  --line: #3b2f43;
  --accent: #e5607f;
  --accent-fg: #1c0d13;
  --glow: rgba(229, 96, 127, .55);
  --font-display: "Gloock", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f0f2; --surface: #fffdfd; --surface-2: #efe6e9; --fg: #231a26; --muted: #6d6072;
    --line: #dccfd4; --accent: #a3233f; --accent-fg: #ffffff; --glow: rgba(163, 35, 63, .45); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f0f2; --surface: #fffdfd; --surface-2: #efe6e9; --fg: #231a26; --muted: #6d6072;
  --line: #dccfd4; --accent: #a3233f; --accent-fg: #ffffff; --glow: rgba(163, 35, 63, .45); color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1rem/1.5 var(--font-body);
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 34rem; margin-inline: auto; display: grid; gap: 1.75rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .5rem; }
.langs { display: flex; gap: .25rem; }
.langs button { height: 2rem; min-width: 2.4rem; padding: 0 .55rem; border-radius: 4px; cursor: pointer; font-size: .75rem; font-weight: 600; letter-spacing: .08em; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.eyebrow { margin: 0; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 400 2.1rem/1.08 var(--font-display); text-wrap: balance; }
.lead { margin: .75rem 0 0; color: var(--muted); max-width: 30rem; }

/* Voice prompt */
.ask { display: grid; gap: 1.25rem; }
.mic-row { display: flex; align-items: center; gap: 1.1rem; }
.mic {
  flex: none; width: 5.5rem; height: 5.5rem; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
}
.mic svg { width: 2.1rem; height: 2.1rem; }
.mic.on { animation: ring 1.4s ease-out infinite; }
@keyframes ring {
  0% { box-shadow: 0 0 0 0 var(--glow); }
  100% { box-shadow: 0 0 0 1.6rem rgba(0, 0, 0, 0); }
}
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; box-shadow: 0 0 0 .4rem var(--glow); } }
.status { margin: 0; min-width: 0; font-size: 1.1rem; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.status small { display: block; margin-top: .25rem; font-size: .85rem; font-weight: 400; color: var(--muted); }

.typed { display: flex; flex-wrap: wrap; gap: .6rem; }
.typed input {
  flex: 1 1 12rem; min-width: 0; height: 3rem; padding: 0 .9rem; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px;
}
.typed input::placeholder { color: var(--muted); }
.btn {
  height: 3rem; padding: 0 1.1rem; border-radius: 6px; cursor: pointer; font-weight: 600;
  border: 1px solid var(--line); background: transparent;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:hover { border-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  height: 2.25rem; padding: 0 .85rem; border-radius: 999px; cursor: pointer; font-size: .9rem;
  background: transparent; border: 1px solid var(--line); color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }

/* Order slip */
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1.25rem 1.1rem 1.1rem; display: grid; gap: 1rem; }
.heard { margin: 0; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.tag {
  display: inline-block; margin-right: .5rem; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: 3px;
  font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); vertical-align: .08em;
}
.lines { list-style: none; margin: 0; padding: 0; }
.line { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: .25rem .75rem; padding-block: 1rem; border-top: 1px dashed var(--line); }
.kind { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding-top: .45rem; }
.line h3 { margin: 0; font: 400 1.3rem/1.2 var(--font-display); text-wrap: balance; }
.line p { margin: .25rem 0 0; font-size: .9rem; color: var(--muted); }
.price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; padding-top: .2rem; }
.price small { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
.why { margin: 0; padding: .75rem .9rem; background: var(--surface-2); border-radius: 4px; font-size: .92rem; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: .9rem; border-top: 2px solid var(--fg); }
.total span:first-child { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.total span:last-child { font: 400 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }

/* Full menu */
.menu { border-top: 1px solid var(--line); padding-top: 1rem; }
.menu summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.menu-body { display: grid; gap: 1.5rem; padding-top: 1.25rem; }
.menu h2 { margin: 0 0 .5rem; font: 400 1.25rem/1.2 var(--font-display); }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem 1rem; }
.item b { font-weight: 500; }
.item span { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.item p { grid-column: 1 / -1; margin: 0; font-size: .85rem; color: var(--muted); }
.foot { margin: 0; font-size: .8rem; color: var(--muted); }

@media (max-width: 26rem) {
  h1 { font-size: 1.8rem; }
  .mic { width: 4.75rem; height: 4.75rem; }
  .line { grid-template-columns: minmax(0, 1fr) auto; }
  .kind { grid-column: 1 / -1; padding-top: 0; }
}

/* Language switch and option groups */
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .5rem; }
.top .eyebrow { margin: 0; }
.langs { display: flex; gap: .35rem; }
.lang { height: 2rem; min-width: 2.5rem; padding: 0 .55rem; border-radius: 4px; cursor: pointer; font-size: .78rem; font-weight: 600; letter-spacing: .08em; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.lang[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--surface-2); }
.group { display: grid; gap: .5rem; }
.glabel { margin: 0; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.typed input { font-size: 1rem; }
</style>

<main class="app">
  <header>
    <div class="top">
      <p class="eyebrow">Trattoria Villa Pergole</p>
      <div id="langs" class="langs" role="group" aria-label="Lingua / Sprache / Language"></div>
    </div>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
  </header>

  <section class="ask">
    <div class="mic-row">
      <button id="mic" class="mic" type="button" aria-pressed="false">

          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"></path>
        </svg>
      </button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
    <form id="form" class="typed">
      <label class="sr" for="q" data-i="qlabel"></label>
      <input id="q" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
      <button class="btn primary" type="submit" data-i="submit"></button>
    </form>
    <div class="group">
      <p class="glabel" data-i="coursesLabel"></p>
      <div id="courses" class="chips" role="group"></div>
    </div>
    <div class="group">
      <p class="glabel" data-i="prefsLabel"></p>
      <div id="chips" class="chips" role="group"></div>
    </div>
  </section>

  <article id="slip" class="slip" aria-live="polite"></article>

  <details class="menu">
    <summary data-i="menuSummary"></summary>
    <div id="menu" class="menu-body"></div>
  </details>

  <p class="foot" data-i="foot"></p>
</main>

      b.type = "button"; b.className = "lang"; b.textContent = l.toUpperCase();
      b.setAttribute("aria-pressed", state.lang === l ? "true" : "false");
      b.addEventListener("click", function () { applyLang(l); });
      el.langs.appendChild(b);
    });
  }
  function renderChips() {
    var t = T();
    el.courses.innerHTML = "";
    ["primo", "secondo", "vino"].forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t[k];
      b.setAttribute("aria-pressed", state.courses[k] ? "true" : "false");
      b.addEventListener("click", function () { toggleCourse(k); });
      el.courses.appendChild(b);
    });
    el.chips.innerHTML = "";
    var list = CHIP_KEYS.slice();
    ["no-carne", "no-pesce"].forEach(function (k) { if (state.prefs[k]) list.push(k); });
    list.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t.chips[k];
      b.setAttribute("aria-pressed", state.prefs[k] ? "true" : "false");
      b.addEventListener("click", function () { togglePref(k); });
      el.chips.appendChild(b);
    });
  }
  function line(kind, name, sub, price) {
    return '<li class="line"><span class="kind">' + esc(kind) + "</span><div><h3>" + esc(name) + "</h3>" +
      (sub ? "<p>" + esc(sub) + "</p>" : "") + '</div><span class="price">' + price + "</span></li>";
  }
  function noteOf(d) { return d.note ? T().notes[d.note] : ""; }
  function whyText(r) {
    var t = T(), sec = r.b && r.v ? overlap(r.v.tags, r.b.tags) : [], pri = r.a && r.v ? overlap(r.v.tags, r.a.tags) : [], lead;
    if (!r.v) return "";
    if (sec.length) lead = t.whySec.replace("%s", t.tags[sec[0]]);
    else if (pri.length) lead = t.whyPri.replace("%s", t.tags[pri[0]]);
    else if (r.a || r.b) lead = t.whyGen;
    else {
      var tg = overlap(r.v.tags, state.prefs.carne ? ["carne-rossa", "carne-bianca"] : state.prefs.pesce ? ["pesce", "crostacei"] : state.prefs.vegetariano ? ["verdure", "formaggio"] : []);
      lead = tg.length ? t.whyOnly.replace("%s", t.tags[tg[0]]) : t.whyNone;
    }
    return lead + " " + r.v.d[state.lang];
  }
  function heardLine() {
    var t = T();
    if (state.example) return t.said.replace("%s", t.exampleSaid);
    if (state.said) return t.said.replace("%s", state.said);
    var names = keys(state.prefs).map(function (k) { return t.chips[k]; });
    return names.length ? t.prefsLine.replace("%s", names.join(", ")) : t.surprise;
  }
  function renderSlip() {
    var r = state.current, t = T();
    if (!r) return;
    var total = (r.a ? r.a.p : 0) + (r.b ? r.b.p : 0) + (r.v ? r.v.g : 0), rows = "";
    if (r.a) rows += line(t.primo, nameOf(r.a), noteOf(r.a), eur(r.a.p));
    if (r.b) rows += line(t.secondo, nameOf(r.b), noteOf(r.b), eur(r.b.p));
    if (r.v) rows += line(t.vino, r.v.n, t.cats[r.v.c], eur(r.v.g) + "<small>" + t.glass + " · " + t.bottle + " " + eur(r.v.p) + "</small>");
    el.slip.innerHTML = '<p class="heard"></p><ol class="lines">' + rows + '</ol><p class="why"></p>' +
      '<div class="total"><span>' + esc(t.total) + "</span><span>" + eur(total) + "</span></div>" +
      '<div class="actions"><button class="btn primary" id="again" type="button">' + esc(t.again) + "</button>" +
      '<button class="btn" id="speak" type="button">' + esc(t.speak) + "</button></div>";
    var h = el.slip.querySelector(".heard");
    if (state.example) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = t.example; h.appendChild(tg); }
    h.appendChild(document.createTextNode(heardLine()));
    el.slip.querySelector(".why").textContent = whyText(r);
    $("again").addEventListener("click", function () { state.example = false; next(); });
    var sp = $("speak");
    if (!("speechSynthesis" in window)) sp.hidden = true; else sp.addEventListener("click", speak);
  }
  function renderMenu() {
    var t = T();
    var html = ["antipasti", "primi", "secondi", "contorni", "formaggi", "dolci"].map(function (k) {
      return "<section><h2>" + esc(t.sections[k]) + "</h2><ul>" + MENU[k].filter(function (d) { return !d.hide; }).map(function (d) {
        var price = d.note === "perhg" ? eur(d.p) + " / 100 g" : eur(d.p);
        var sub = [d.dd ? d.dd[state.lang] : "", noteOf(d)].filter(Boolean).join(". ");
        return '<li class="item"><b>' + esc(nameOf(d)) + "</b><span>" + price + "</span>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + "</li>";
      }).join("") + "</ul></section>";
    });
    html.push("<section><h2>" + esc(t.wineHead) + "</h2><ul>" + MENU.vini.map(function (v) {
      return '<li class="item"><b>' + esc(v.n) + "</b><span>" + eur(v.g) + " · " + eur(v.p) + "</span><p>" + esc(t.cats[v.c] + ". " + v.d[state.lang]) + "</p></li>";
    }).join("") + "</ul></section>");
    el.menu.innerHTML = html.join("");
  }
  function applyLang(l) {
    state.lang = l;
    var t = T();
    document.documentElement.lang = l;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (n) { n.textContent = t[n.getAttribute("data-i")]; });
    el.q.placeholder = t.ph;
    el.mic.setAttribute("aria-label", t.micLabel);
    renderLangs(); renderChips(); renderMenu(); renderSlip();
    if (!state.listening && !state.keepStatus) setStatus(state.current && !state.example ? t.found : t.tap, state.example ? t.tryHint : "");
  }
  function setStatus(main, small) {
    el.status.textContent = main;
    if (small) { var s = document.createElement("small"); s.textContent = small; el.status.appendChild(s); }
  }

  /* ---------- Actions ---------- */
  function next() {
    state.current = propose(state.prefs, state.shown, state.courses);
    renderChips(); renderSlip();
  }
  function resetShown() { state.shown = { k: {}, w: {} }; }
  function run(text) {
    var l = detectLang(norm(text), state.lang);
    var p = parse(text);
    state.prefs = p.prefs; state.courses = p.courses; state.said = text; state.example = false; state.keepStatus = false;
    resetShown();
    if (l !== state.lang) applyLang(l);
    setStatus(T().found);
    next();
  }
  function togglePref(key) {
    var p = state.prefs;
    if (p[key]) delete p[key];
    else {
      p[key] = true;
      if (key === "carne") delete p["no-carne"];
      if (key === "pesce") delete p["no-pesce"];
      if (key === "leggero") delete p.sostanzioso;
      if (key === "sostanzioso") delete p.leggero;
    }
    state.said = ""; state.example = false; resetShown(); next();
  }
  function toggleCourse(k) {
    var c = state.courses, on = keys(c).length;
    if (c[k] && on === 1) return;
    c[k] = !c[k];
    state.example = false; resetShown(); next();
  }
  function speak() {
    var r = state.current;
    if (!r || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(T().spoken(r.a && nameOf(r.a), r.b && nameOf(r.b), r.v && r.v.n));
      u.lang = SPEECH_LANG[state.lang];
      window.speechSynthesis.speak(u);
    } catch (e) { /* voice output is optional */ }
  }

  /* ---------- Voice input ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, finalText = "", errored = false;
  function stopUI() { state.listening = false; el.mic.classList.remove("on"); el.mic.setAttribute("aria-pressed", "false"); }
  function blocked() {
    state.keepStatus = true;
    setStatus(T().blocked, T().blocked2);
    try { el.q.focus(); } catch (e) { /* ignore */ }
  }
  el.mic.addEventListener("click", function () {
    if (state.listening && rec) { rec.stop(); return; }
    if (!SR) { blocked(); return; }
    try {
      errored = false; finalText = "";
      rec = new SR();
      rec.lang = SPEECH_LANG[state.lang]; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
      rec.onstart = function () { state.listening = true; el.mic.classList.add("on"); el.mic.setAttribute("aria-pressed", "true"); setStatus(T().listening); };
      rec.onresult = function (e) {
        var t = "";
        for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        finalText = t; el.q.value = t; setStatus("«" + t + "»");
      };
      rec.onerror = function (e) {
        errored = true;
        if (e.error === "no-speech") { setStatus(T().nohear, T().nohear2); }
        else if (e.error !== "aborted") blocked();
        else errored = false;
      };
      rec.onend = function () {
        stopUI();
        if (finalText.trim()) run(finalText.trim());
        else if (!errored) setStatus(T().tap);
      };
      rec.start();
    } catch (err) { stopUI(); blocked(); }
  });
  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var t = el.q.value.trim();
    if (t) run(t);
  });

  /* ---------- Start with a worked example in the phone's language ---------- */
  var nl = String((navigator.languages && navigator.languages[0]) || navigator.language || "it").slice(0, 2).toLowerCase();
  state.prefs = { carne: true };
  state.example = true;
  state.current = propose(state.prefs, state.shown, state.courses);
  applyLang(UI[nl] ? nl : "it");
})();
</script>

</body></html>
